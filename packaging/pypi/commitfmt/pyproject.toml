[project]
name = "commitfmt"
authors = [
    {name = "Mikhael Khrustik", email = "misha@myrt.co"},
]
description = "Utility for formatting and verifying the commit message."
version = "1.2.0"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["git", "hook"]
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "commitfmt-windows-arm64==1.2.0; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "commitfmt-windows-x64==1.2.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "commitfmt-darwin-arm64==1.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "commitfmt-darwin-x64==1.2.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "commitfmt-linux-arm64==1.2.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "commitfmt-linux-x64==1.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
scripts = { "commitfmt"="commitfmt.__main__:main" }
